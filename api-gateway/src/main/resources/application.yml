spring.application.name: api-gateway

eureka.client.service-url.defaultZone: http://localhost:8761/eureka

jwt.secretKey:
  ancdabvdgjgj2migpgnpernvperwng3wuognvpawfvwpausuii

server:
  port: 8080

spring:
  cloud:
    gateway:
      server:
        webflux:
          routes:
            - id: identity-service
              uri: lb://IDENTITY-SERVICE
              predicates:
                - Path=/api/v1/identity/**
              filters:
                - StripPrefix=2

            - id: user-service
              uri: lb://USER-SERVICE
              predicates:
                - Path=/api/v1/users/**
              filters:
                - StripPrefix=2

            - id: event-service
              uri: lb://EVENT-SERVICE
              predicates:
                - Path=/api/v1/events/**
              filters:
                - StripPrefix=2
                - Authentication

            - id: prayer-service
              uri: lb://PRAYER-SERVICE
              predicates:
                - Path=/api/v1/prayers/**
              filters:
                - StripPrefix=2
                - Authentication

            - id: program-service
              uri: lb://PROGRAM-SERVICE
              predicates:
                - Path=/api/v1/programs/**
              filters:
                - StripPrefix=2
                - Authentication

            - id: notification-service
              uri: lb://NOTIFICATION-SERVICE
              predicates:
                - Path=/api/v1/notifications/**
              filters:
                - StripPrefix=2
                - Authentication


eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
